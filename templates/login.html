{% extends "base.html" %}

{% block title %}Sign In - Event Money Tracker{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-64px)] flex items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-hidden">
    <!-- Ambient Background Glows -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md bg-slate-900/90 border border-slate-800/80 rounded-2xl p-8 sm:p-10 shadow-2xl backdrop-blur-xl relative z-10">
        <!-- Brand Header -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 rounded-2xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center mx-auto mb-4 shadow-[0_0_20px_rgba(99,102,241,0.25)]">
                <i class="fa-solid fa-vault text-2xl text-indigo-400"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold font-outfit text-white tracking-tight">Welcome Back</h1>
            <p class="text-sm text-slate-400 mt-2">Track event expenses, gifts, and cash flow effortlessly</p>
        </div>

        <!-- Google OAuth 1-Click Button -->
        <a href="{{ url_for('auth.google_login') }}" class="w-full flex items-center justify-center gap-3 py-3 px-4 bg-white hover:bg-slate-100 text-slate-900 font-semibold text-sm rounded-xl transition duration-200 shadow-md hover:shadow-lg border border-slate-200">
            <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
        </a>

        <!-- Divider -->
        <div class="flex items-center my-6">
            <div class="flex-grow border-t border-slate-800"></div>
            <span class="px-3 text-xs uppercase tracking-wider text-slate-500 font-medium">or sign in with email</span>
            <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Local Login Form -->
        <form action="{{ url_for('auth.local_login') }}" method="POST" class="space-y-4">
            <div class="space-y-1.5">
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Email Address</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-envelope absolute left-3.5 text-slate-500 text-sm pointer-events-none"></i>
                    <input type="email" id="email" name="email" class="w-full bg-slate-800/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white text-sm rounded-xl pl-10 pr-4 py-3 outline-none transition" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="space-y-1.5">
                <label for="password" class="block text-xs font-bold uppercase tracking-wider text-slate-300">Password</label>
                <div class="relative flex items-center">
                    <i class="fa-solid fa-lock absolute left-3.5 text-slate-500 text-sm pointer-events-none"></i>
                    <input type="password" id="password" name="password" class="w-full bg-slate-800/80 border border-slate-700/80 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-white text-sm rounded-xl pl-10 pr-4 py-3 outline-none transition" placeholder="••••••••" required autocomplete="current-password">
                </div>
            </div>

            <div class="flex items-center justify-between pt-1">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" name="remember" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-indigo-500/30" checked>
                    <span class="text-xs text-slate-300">Remember me</span>
                </label>
            </div>

            <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-indigo-600/25 transition duration-200 flex items-center justify-center gap-2 mt-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Sign In to Dashboard</span>
            </button>
        </form>

        <div class="text-center mt-6 pt-4 border-t border-slate-800/80">
            <p class="text-xs text-slate-400">Don't have an account yet? <a href="{{ url_for('ui.register') }}" class="text-indigo-400 hover:text-indigo-300 font-semibold ml-1 transition">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
